services:
  medical_ai:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - rabbitmq
    volumes:
      - ./models:/models
  rabbitmq:
    image: "rabbitmq:3-management"
    ports:
      - "5672:5672"
      - "15672:15672"
  postgres:
    image: "postgres:13"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
      - POSTGRES_DB=medical_ai_db
    ports:
      - "5432:5432"

  hospital_management:
    build:
      context: ./hospital_management
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=adminpassword
      - DB_NAME=medical_ai_db
    depends_on:
      - postgres
      - rabbitmq

volumes:
  rabbitmq_data: {}
